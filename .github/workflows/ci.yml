name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix backend ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix backend ci
      - run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: car_service_app
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: car_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U car_service_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      TEST_DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long!!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend run prisma:migrate
      - run: npm run test:backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm run test:frontend

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: car_service_app
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: car_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U car_service_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      TEST_DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long!!
      NODE_ENV: development
      LLM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            package-lock.json
      - name: Install root
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Prisma migrate
        run: npm --prefix backend run prisma:migrate
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: E2E tests
        run: npm run test:e2e
