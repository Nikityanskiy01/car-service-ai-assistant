name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix backend ci
      - run: npm run lint
      - name: API route inventory
        env:
          DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
          JWT_SECRET: ci-test-jwt-secret-min-32-chars-long!!
          NODE_ENV: test
          LLM_ENABLED: 'false'
        run: npm run routes:check
      - name: OpenAPI covers inventory
        run: npm run openapi:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix backend ci
      - run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: car_service_app
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: car_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U car_service_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      TEST_DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long!!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend run prisma:migrate
      - run: npm run test:backend
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 14

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm run test:frontend
        env:
          CI: true
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: car_service_app
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: car_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U car_service_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "sh -c 'redis-cli -a ci-e2e-redis-auth ping || redis-cli ping'"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      TEST_DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long!!
      NODE_ENV: development
      LLM_ENABLED: 'false'
      REDIS_URL: redis://:ci-e2e-redis-auth@127.0.0.1:6379
      DIAGNOSIS_ASYNC_ENABLED: 'false'
      CORS_ORIGIN: http://127.0.0.1:5173
      DEMO_CLIENT_PASSWORD: Ci-Client-Seed-2026!
      DEMO_MANAGER_PASSWORD: Ci-Manager-Seed-2026!
      DEMO_ADMIN_PASSWORD: Ci-Admin-Seed-2026!
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            package-lock.json
      - name: Install root
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Require Redis AUTH
        run: node -e "const Redis=require('./backend/node_modules/ioredis'); (async()=>{ const r=new Redis('redis://127.0.0.1:6379'); await r.config('SET','requirepass','ci-e2e-redis-auth'); await r.quit(); })().catch((e)=>{ console.error(e); process.exit(1); });"
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Prisma migrate
        run: npm --prefix backend run prisma:migrate
      - name: Seed users
        run: npm --prefix backend run db:seed
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: npm audit backend (prod)
        run: npm --prefix backend audit --omit=dev --audit-level=high
      - name: npm audit frontend (prod)
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - name: SBOM backend
        run: npm --prefix backend sbom --omit=dev > backend-sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-sbom
          path: backend-sbom.spdx.json
          retention-days: 14
      - name: Trivy filesystem (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
      - name: Trivy filesystem (HIGH report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH
          exit-code: '0'

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@c8921694a53d95ce424af6ae76dbebf3b6a83aef # v3.88.30
        with:
          version: v3.88.30
          extra_args: --results=verified

  perf:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: car_service_app
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: car_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U car_service_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long!!
      NODE_ENV: test
      LLM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend run prisma:migrate
      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Start API
        run: npm --prefix backend run start &
      - name: Wait for live
        run: |
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3000/api/live && exit 0
            sleep 2
          done
          exit 1
      - name: k6 smoke
        run: K6_VUS=1 K6_DURATION=15s BASE_URL=http://127.0.0.1:3000 k6 run tests/perf/k6-consultation.js

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Preview + Lighthouse
        run: |
          npx --prefix frontend --yes vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json


