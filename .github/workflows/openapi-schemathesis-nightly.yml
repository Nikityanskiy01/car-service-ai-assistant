name: Nightly OpenAPI Schemathesis

on:
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-schemathesis
  cancel-in-progress: true

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: car_service_app
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: car_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U car_service_app"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://car_service_app:change-me@localhost:5432/car_service_test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long!!
      NODE_ENV: test
      LLM_ENABLED: 'false'
      DIAGNOSIS_ASYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e5324b349d48da # v5.6.0
        with:
          python-version: '3.12'
      - run: npm --prefix backend ci
      - run: npm --prefix backend run prisma:migrate
      - name: Start API
        run: |
          npm --prefix backend run start &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/api/live >/dev/null; then
              echo "API is live"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become live"
          exit 1
      - name: Schemathesis public ops
        run: |
          python -m pip install --quiet 'schemathesis>=3.39,<4'
          schemathesis run specs/001-ai-consultation-platform/contracts/openapi.yaml \
            --url http://127.0.0.1:3000/api \
            --include-path '/live' \
            --include-path '/ready' \
            --include-path '/health' \
            --hypothesis-max-examples 3 \
            --checks not_a_server_error
