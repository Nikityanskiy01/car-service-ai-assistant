# VM nginx: HTTP only. TLS terminates on edge openresty (Proxmox/host)
# in front of this VM. Public cert: Let's Encrypt for autoservice-demo.zernov.online.


server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name autoservice-demo.zernov.online _;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;

    # Локальные HTML-затычки, если Docker-стек на :8080 недоступен.
    error_page 502 /nginx-errors/502.html;
    error_page 503 /nginx-errors/503.html;
    error_page 504 /nginx-errors/504.html;

    location ^~ /nginx-errors/ {
        alias /home/demo/car-service-ai-assistant/deploy/nginx/errors/;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_intercept_errors off;
    }
}
