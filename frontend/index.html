<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Автосервис — ИИ-диагностика</title>
    <meta
      name="description"
      content="White-label демо автосервиса: ИИ-диагностика в чате, услуги, запись, работы."
    />
    <meta name="theme-color" content="#0b0d12" />
    <script>
      (function () {
        var key = 'car_service_theme_mode';
        var theme = localStorage.getItem(key);
        if (!theme && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        if (!theme) theme = 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f4f5' : '#0b0d12');
      })();
    </script>
    <meta property="og:title" content="Автосервис — ИИ-диагностика" />
    <meta
      property="og:description"
      content="Узнайте причину неисправности за 2–4 минуты и запишитесь в сервис."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
