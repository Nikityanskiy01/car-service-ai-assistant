    get:
      tags: [Other]
      summary: Получить root
      operationId: get_root
      responses:
        '200':
          description: OK
        '4XX':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
