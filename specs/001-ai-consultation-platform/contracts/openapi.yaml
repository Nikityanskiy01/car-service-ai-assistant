components:
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        error: { type: string }
        code: { type: string }
    Ok:
      type: object
      properties:
        ok: { type: boolean }
    ConsultationCreate:
      type: object
      additionalProperties: true
      properties:
        serviceCategoryId: { type: string, format: uuid }
    Consultation:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        guestToken: { type: string, nullable: true }
        vehicleId: { type: string, format: uuid, nullable: true }
        progressPercent: { type: integer, nullable: true }
        confidencePercent: { type: integer, nullable: true }
        isGuest: { type: boolean }
        createdAt: { type: string, format: date-time }
    ConsultationDetail:
      allOf:
        - $ref: '#/components/schemas/Consultation'
        - type: object
          additionalProperties: true
          properties:
            flowState: { type: object, nullable: true }
            messages:
              type: array
              items: { $ref: '#/components/schemas/ConsultationChatMessage' }
    ConsultationChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        sender: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    ConsultationList:
      type: array
      items: { $ref: '#/components/schemas/Consultation' }
    ConsultationMessage:
      type: object
      required: [content]
      properties:
        content: { type: string }
    ConsultationClaim:
      type: object
      required: [guestToken]
      properties:
        guestToken: { type: string }
    ConsultationReportCreate:
      type: object
      properties:
        label: { type: string }
    ConsultationPhoto:
      type: object
      required: [mimeType, imageBase64]
      properties:
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        imageBase64: { type: string }
    GuestServiceRequestCreate:
      type: object
      required: [fullName, phone, consentPersonalData]
      properties:
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        consentPersonalData: { type: boolean }
    DiagnosisJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { type: string }
        errorMessage: { type: string, nullable: true }
    BookingCreate:
      type: object
      required: [preferredAt]
      properties:
        preferredAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        serviceRequestId: { type: string, format: uuid, nullable: true }
        vehicleId: { type: string, format: uuid, nullable: true }
    BookingGuestCreate:
      type: object
      required: [preferredAt, fullName, phone, consentPersonalData]
      properties:
        preferredAt: { type: string, format: date-time }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        serviceTitle: { type: string, nullable: true }
        categoryLabel: { type: string, nullable: true }
        consentPersonalData: { type: boolean }
    BookingPatch:
      type: object
      properties:
        status: { type: string, enum: [PENDING, CONFIRMED, ARRIVED, NO_SHOW, CANCELLED] }
        preferredAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        preferredAt: { type: string, format: date-time }
        clientId: { type: string, format: uuid, nullable: true }
        vehicleId: { type: string, format: uuid, nullable: true }
        serviceRequestId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    BookingList:
      oneOf:
        - type: array
          items: { $ref: '#/components/schemas/Booking' }
        - type: object
          properties:
            items:
